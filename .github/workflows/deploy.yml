name: Update APT Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install APT build tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev bzip2 gzip xz-utils zstd sed

      - name: Generate APT Indexes and Clean Hashes
        run: |
          touch .nojekyll

          # 1. Quét toàn bộ deb và xóa bỏ prefix "./" gây lỗi 308/404 trên Cydia
          dpkg-scanpackages -m . /dev/null > Packages
          sed -i 's|Filename: \./|Filename: |g' Packages

          # 2. Xóa các file nén cũ trước khi nén mới để tránh lệch hash
          rm -f Packages.gz Packages.bz2 Packages.xz Packages.zst Release

          # 3. Tạo các bản nén đồng bộ
          gzip -c9 Packages > Packages.gz
          bzip2 -c9 Packages > Packages.bz2
          xz -c9 Packages > Packages.xz
          zstd -c19 Packages > Packages.zst

          # 4. Tạo Header cho Release
          cat << 'REL' > Release
          Origin: DS Gaming APT Repository
          Label: DS Gaming
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm iphoneos-arm64
          Components: main
          Description: A permanent, automated archive of iOS tweaks and utilities.
          REL

          # 5. Sinh chuẩn MD5Sum
          echo "MD5Sum:" >> Release
          for f in Packages Packages.gz Packages.bz2 Packages.xz Packages.zst; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              hash=$(md5sum "$f" | cut -d ' ' -f 1)
              echo " $hash $size $f" >> Release
            fi
          done

          # 6. Sinh chuẩn SHA1 (Cydia yêu cầu bắt buộc)
          echo "SHA1:" >> Release
          for f in Packages Packages.gz Packages.bz2 Packages.xz Packages.zst; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              hash=$(sha1sum "$f" | cut -d ' ' -f 1)
              echo " $hash $size $f" >> Release
            fi
          done

          # 7. Sinh chuẩn SHA256 (Sileo/Zebra yêu cầu)
          echo "SHA256:" >> Release
          for f in Packages Packages.gz Packages.bz2 Packages.xz Packages.zst; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              hash=$(sha256sum "$f" | cut -d ' ' -f 1)
              echo " $hash $size $f" >> Release
            fi
          done

      - name: Commit and Push valid indexes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "fix: re-generate compliant APT indexes and hashes [skip ci]" && git push origin main)
