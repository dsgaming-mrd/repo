name: Update APT Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev bzip2 gzip xz-utils sed

      - name: Generate Flat APT Repository
        run: |
          touch .nojekyll
          rm -f Packages Packages.gz Packages.bz2 Packages.xz Release Release.gpg InRelease
          dpkg-scanpackages -m . /dev/null > Packages
          sed -i 's|Filename: \./|Filename: |g' Packages
          bzip2 -c9 Packages > Packages.bz2
          xz -c9 Packages > Packages.xz
          cat << 'EOF' > Release
Origin: DS Gaming APT Repository
Label: DS Gaming
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm iphoneos-arm64
Components: main
Description: A permanent archive of iOS tweaks and utilities.
EOF

      - name: Push index updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "fix: automatic APT indexing [skip ci]" && git push origin main)
