name: Update APT Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install APT build tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev bzip2 gzip xz-utils zstd

      - name: Generate Flat APT Repository
        run: |
          # Tao file .nojekyll
          touch .nojekyll

          # Quet packages
          dpkg-scanpackages -m . /dev/null > Packages
          
          # Tao cac ban nen
          gzip -c9 Packages > Packages.gz
          bzip2 -c9 Packages > Packages.bz2
          xz -c9 Packages > Packages.xz
          zstd -c19 Packages > Packages.zst

          # Tao file Release chuan Flat Repo (Khong kem ma Hash loi gay NODATA tren Cydia)
          cat << 'REL' > Release
          Origin: DS Gaming APT Repository
          Label: DS Gaming
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm iphoneos-arm64
          Components: main
          Description: A permanent, automated archive of iOS tweaks and utilities.
          REL

      - name: Commit and Push valid indexes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .nojekyll Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git diff --quiet && git diff --staged --quiet || (git commit -m "fix: generate cydia compatible flat repo [skip ci]" && git push origin main)
